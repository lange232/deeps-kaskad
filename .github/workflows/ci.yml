name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r panel/requirements-dev.txt
      # The panel shells out to `awg` for key derivation. Its keys are plain
      # WireGuard keys, so the stock `wg` from wireguard-tools answers the same;
      # the obfuscation parameters are applied later, in the config text.
      - name: Install awg key tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          sudo ln -sf "$(command -v wg)" /usr/local/bin/awg
      - name: Run tests
        run: python -B -m unittest discover -s tests -v

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible
        run: pip install ansible-core
      # --syntax-check parses the playbooks without contacting any host; a real
      # --check run needs the private inventories, which are not in the repo.
      - name: Syntax-check playbooks
        run: |
          ansible-playbook --syntax-check -i inventory.example.yml playbooks/site.yml
          ansible-playbook --syntax-check -i inventory.example.yml playbooks/check.yml
