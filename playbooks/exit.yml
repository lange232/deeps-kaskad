---
# Builds an exit node: AmneziaWG server side, NAT, forwarding. The panel on
# S1 gets the matching client config afterwards; this playbook never touches
# S1 or the panel database.
#
#   ansible-playbook -i inventory.exit.yml playbooks/exit.yml --check
#   ansible-playbook -i inventory.exit.yml playbooks/exit.yml
- name: Exit node
  hosts: all
  become: true
  roles:
    - role: exit
