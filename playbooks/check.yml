---
- name: Interface state
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: awg show
      ansible.builtin.command: awg show
      register: kaskad_show
      changed_when: false

    - name: Show
      ansible.builtin.debug:
        var: kaskad_show.stdout_lines

    - name: Internet exits configured
      ansible.builtin.shell: |
        python3 - <<'PY'
        import sqlite3, sys
        conn = sqlite3.connect("/var/lib/kaskad/panel.db")
        n = conn.execute(
            "SELECT count(*) FROM exits WHERE enabled = 1 AND mode = 'internet'"
        ).fetchone()[0]
        sys.exit(0 if n else 1)
        PY
      args:
        executable: /bin/bash
      register: kaskad_has_internet
      changed_when: false
      failed_when: false

    - name: Handshake with the active exit
      ansible.builtin.shell: |
        set -o pipefail
        iface=$(tr -d '[:space:]' < /run/kaskad/active-exit)
        awg show "$iface" latest-handshakes | awk '{ if ($NF + 0 > 0) found = 1 } END { exit(found ? 0 : 1) }'
      args:
        executable: /bin/bash
      changed_when: false
      when: kaskad_has_internet.rc == 0

    - name: Transit through the active exit
      ansible.builtin.shell: |
        set -o pipefail
        iface=$(tr -d '[:space:]' < /run/kaskad/active-exit)
        ping -c2 -W3 -I "$iface" 1.1.1.1
      args:
        executable: /bin/bash
      register: kaskad_upstream_ping
      changed_when: false
      failed_when: kaskad_upstream_ping.rc != 0
      when: kaskad_has_internet.rc == 0

- name: S1 entry
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Client routing rules match the database
      ansible.builtin.shell: |
        set -o pipefail
        ROUTE_TABLE={{ kaskad_route_table }} python3 - <<'PY'
        import os, sqlite3, subprocess, sys

        table = os.environ["ROUTE_TABLE"]
        rules = subprocess.run(["ip", "rule", "show"], capture_output=True, text=True).stdout
        missing = []

        conn = sqlite3.connect("/var/lib/kaskad/panel.db")
        conn.row_factory = sqlite3.Row
        granted = {
            r["client_id"]
            for r in conn.execute(
                "SELECT ce.client_id FROM client_internet_exits ce "
                "JOIN exits e ON e.id = ce.exit_id "
                "WHERE e.enabled = 1 AND e.mode = 'internet'"
            )
        }
        for cl in conn.execute(
            "SELECT id, ip, internet, table_num FROM clients WHERE enabled = 1"
        ):
            if not cl["internet"]:
                continue
            # Clients with granted exits use the table allocated in the panel.
            lookup = cl["table_num"] if cl["id"] in granted else table
            if not lookup:
                missing.append(f"client {cl['ip']} has granted exits but no table")
                continue
            if f"from {cl['ip']} iif awg0 lookup {lookup}" not in rules:
                missing.append(f"internet rule for {cl['ip']} -> {lookup}")

        for row in conn.execute(
            "SELECT c.ip, e.id, e.routes, e.table_num FROM client_exits ce "
            "JOIN clients c ON c.id = ce.client_id "
            "JOIN exits e ON e.id = ce.exit_id "
            "WHERE c.enabled = 1 AND e.enabled = 1 AND e.mode = 'routes'"
        ):
            for cidr in [x.strip() for x in row["routes"].split(",") if x.strip()]:
                # iproute2 prints a /32 destination without the prefix length.
                shown = cidr[:-3] if cidr.endswith("/32") else cidr
                if f"from {row['ip']} to {shown} iif awg0 lookup {row['table_num']}" not in rules:
                    missing.append(f"route {row['ip']} -> {cidr}")

        if missing:
            print("missing rules: " + "; ".join(missing))
            sys.exit(1)
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Routing tables and client links are consistent
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import sqlite3, sys

        conn = sqlite3.connect("/var/lib/kaskad/panel.db")
        problems = []

        tables = [
            r[0] for r in conn.execute(
                "SELECT table_num FROM exits WHERE table_num > 0 "
                "UNION ALL SELECT table_num FROM clients WHERE table_num > 0"
            )
        ]
        duplicates = {t for t in tables if tables.count(t) > 1}
        if duplicates:
            problems.append(f"table numbers used twice: {sorted(duplicates)}")
        low = [t for t in tables if t < 1001]
        if low:
            problems.append(f"table numbers below 1001: {sorted(low)}")

        for name, sql in (
            ("client_exits",
             "SELECT count(*) FROM client_exits ce WHERE "
             "ce.client_id NOT IN (SELECT id FROM clients) "
             "OR ce.exit_id NOT IN (SELECT id FROM exits)"),
            ("client_internet_exits",
             "SELECT count(*) FROM client_internet_exits ce WHERE "
             "ce.client_id NOT IN (SELECT id FROM clients) "
             "OR ce.exit_id NOT IN (SELECT id FROM exits)"),
        ):
            orphans = conn.execute(sql).fetchone()[0]
            if orphans:
                problems.append(f"{name}: {orphans} rows point at missing objects")

        if problems:
            print("inconsistent database: " + "; ".join(problems))
            sys.exit(1)
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Panel certificate is valid for two more weeks
      ansible.builtin.shell: |
        set -o pipefail
        cert=$(python3 -c 'import json; print(json.load(open("/etc/kaskad/panel.json"))["tls"]["cert"])')
        openssl x509 -in "$cert" -noout -checkend 1209600
      args:
        executable: /bin/bash
      changed_when: false

    - name: fail2ban jails are active
      ansible.builtin.shell: |
        set -o pipefail
        for jail in kaskad-panel sshd; do
            fail2ban-client status "$jail" > /dev/null
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Routed exit subnets are installed
      ansible.builtin.shell: |
        set -o pipefail
        python3 - <<'PY'
        import os, sqlite3, subprocess, sys

        missing = []
        conn = sqlite3.connect("/var/lib/kaskad/panel.db")
        conn.row_factory = sqlite3.Row
        for row in conn.execute(
            "SELECT iface, routes, table_num FROM exits "
            "WHERE enabled = 1 AND mode = 'routes' AND table_num > 0"
        ):
            # An exit that is not up yet has no routes; the failover daemon
            # adds them as soon as the interface appears.
            if not os.path.exists(f"/sys/class/net/{row['iface']}"):
                continue
            res = subprocess.run(
                ["ip", "route", "show", "table", str(row["table_num"])],
                capture_output=True, text=True,
            )
            if res.returncode != 0:
                missing.append(f"table {row['table_num']} for {row['iface']}")
                continue
            shown_routes = [line.split() for line in res.stdout.splitlines() if line.split()]
            for cidr in [x.strip() for x in (row["routes"] or "").split(",") if x.strip()]:
                prefix = cidr[:-3] if cidr.endswith("/32") else cidr
                if not any(
                    parts[0] == prefix and f"dev {row['iface']}" in " ".join(parts)
                    for parts in shown_routes
                ):
                    missing.append(f"{cidr} via {row['iface']} in table {row['table_num']}")

        if missing:
            print("missing subnet routes: " + "; ".join(missing))
            sys.exit(1)
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Active internet route present when exits exist
      ansible.builtin.shell: |
        set -o pipefail
        if ip route show table {{ kaskad_route_table }} | grep -q "default dev awg"; then
            exit 0
        fi
        python3 - <<'PY'
        import sqlite3, sys
        conn = sqlite3.connect("/var/lib/kaskad/panel.db")
        n = conn.execute(
            "SELECT count(*) FROM exits WHERE enabled = 1 AND mode = 'internet'"
        ).fetchone()[0]
        sys.exit(1 if n else 0)
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Active exit recorded
      ansible.builtin.shell: |
        set -o pipefail
        iface=$(tr -d '[:space:]' < /run/kaskad/active-exit)
        [ "$iface" = "none" ] && exit 0
        [ -n "$iface" ] && [ -e "/sys/class/net/$iface" ]
      args:
        executable: /bin/bash
      changed_when: false
      when: kaskad_has_internet.rc == 0

    - name: Recent backup
      ansible.builtin.shell: |
        set -o pipefail
        dir={{ kaskad_backup_dir }}
        newest=$(find "$dir" -maxdepth 1 -type f -name 'kaskad-*.tar.gz' \
            -printf '%T@\n' 2>/dev/null | sort -n | tail -1)
        if [ -z "$newest" ]; then
            echo "no backups yet"
            exit 0
        fi
        age=$(( $(date +%s) - ${newest%.*} ))
        echo "newest backup is $((age / 3600))h old"
        if [ "$age" -gt $(( 2 * 86400 )) ]; then
            echo "backup is stale: the timer is not working"
            exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: NAT towards the upstream
      ansible.builtin.shell: |
        set -o pipefail
        iptables -t nat -S POSTROUTING | grep -qE "10\.80\.0\.0/24.*-o awg\+.*MASQUERADE"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Client traffic allowed in FORWARD
      ansible.builtin.shell: |
        set -o pipefail
        iptables -C FORWARD -i awg0 -o awg+ -j ACCEPT
        iptables -C FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        iptables -C FORWARD -i awg0 -j DROP
      args:
        executable: /bin/bash
      changed_when: false

    - name: Client peers
      ansible.builtin.command: awg show awg0
      register: kaskad_awg0_show
      changed_when: false

    - name: Show awg0
      ansible.builtin.debug:
        var: kaskad_awg0_show.stdout_lines
