<section id="traffic">
    <div class="toolbar">
      <h2 class="oc-section__title" style="margin:0">traffic</h2>
      <div class="actions" style="gap:4px">
        {% for key in ranges %}
        <a class="oc-btn oc-btn--sm {{ 'oc-btn--contrast' if key == period else 'oc-btn--ghost' }}"
           {% if key == period %}aria-current="true"{% endif %} href="{{ chart_url }}?range={{ key }}#traffic">{{ key }}</a>
        {% endfor %}
      </div>
    </div>
    <div class="oc-panel" style="padding:16px">
      {% if chart %}
      <div class="traffic-totals">
        <span class="traffic-key traffic-key--down"></span>
        <span class="oc-muted">downloaded</span><span class="oc-num">{{ chart.total_tx }}</span>
        <span class="traffic-key traffic-key--up"></span>
        <span class="oc-muted">uploaded</span><span class="oc-num">{{ chart.total_rx }}</span>
        <span class="oc-muted" style="margin-left:auto">peak {{ chart.peak }}</span>
      </div>
      <svg class="traffic-chart" viewBox="0 0 {{ chart.width }} {{ chart.height }}"
           preserveAspectRatio="none" role="img" aria-label="traffic">
        {% for bar in chart.bars %}
        <rect class="traffic-down" x="{{ bar.x }}" y="{{ chart.height - bar.down }}" width="{{ chart.bar_width }}" height="{{ bar.down }}"/>
        <rect class="traffic-up" x="{{ bar.up_x }}" y="{{ chart.height - bar.up }}" width="{{ chart.bar_width }}" height="{{ bar.up }}"/>
        {% endfor %}
      </svg>
      <div class="traffic-axis"><span>{{ chart.from }}</span><span>{{ chart.to }}</span></div>
      {% else %}
      <p class="oc-muted" style="margin:0">no traffic recorded yet</p>
      {% endif %}
    </div>
  </section>
