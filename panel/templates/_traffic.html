<section id="traffic">
    <div class="toolbar">
      <h2 class="oc-section__title" style="margin:0">traffic</h2>
      <div class="actions" style="gap:4px">
        {% for key in ranges %}
        <a class="oc-btn oc-btn--sm {{ 'oc-btn--contrast' if key == period else 'oc-btn--ghost' }}"
           {% if key == period %}aria-current="true"{% endif %} href="{{ chart_url }}?range={{ key }}#traffic">{{ key }}</a>
        {% endfor %}
      </div>
    </div>
    <div class="oc-panel" style="padding:16px">
      {% if chart %}
      <div class="traffic-totals">
        <span class="traffic-key traffic-key--down"></span>
        <span class="oc-muted">downloaded</span><span class="oc-num">{{ chart.total_tx }}</span>
        <span class="traffic-key traffic-key--up"></span>
        <span class="oc-muted">uploaded</span><span class="oc-num">{{ chart.total_rx }}</span>
        <span class="oc-muted" style="margin-left:auto">peak {{ chart.peak }}</span>
      </div>
      <svg id="traffic-chart" class="traffic-chart" viewBox="0 0 {{ chart.width }} {{ chart.height }}"
           preserveAspectRatio="none" role="img" aria-label="traffic">
        {% for bar in chart.bars %}
        <rect class="traffic-down" x="{{ bar.x }}" y="{{ chart.height - bar.down }}" width="{{ bar.width }}" height="{{ bar.down }}"/>
        <rect class="traffic-up" x="{{ bar.up_x }}" y="{{ chart.height - bar.up }}" width="{{ bar.width }}" height="{{ bar.up }}"/>
        {% endfor %}
        <rect id="traffic-selection" class="traffic-selection" height="{{ chart.height }}" visibility="hidden"/>
      </svg>
      <div class="traffic-axis"><span>{{ chart.from }}</span><span>{{ chart.to }}</span></div>
      <div class="traffic-inspector" hidden>
        <label class="oc-muted" for="traffic-interval">Interval</label>
        <input id="traffic-interval" type="range" min="0" max="{{ chart.intervals | length - 1 }}" value="0">
        <output id="traffic-reading" for="traffic-interval"></output>
      </div>
      <script>
      (function () {
        const intervals = {{ chart.intervals | tojson }};
        const fraction = {{ chart.interval_fraction | tojson }};
        const width = {{ chart.width }};
        const chart = document.getElementById('traffic-chart');
        const selection = document.getElementById('traffic-selection');
        const interval = document.getElementById('traffic-interval');
        const reading = document.getElementById('traffic-reading');
        const pad = n => String(n).padStart(2, '0');
        // Timestamps arrive as epochs: the reader's timezone, not the server's.
        function clock(ts) {
          const d = new Date(ts * 1000);
          const hhmm = pad(d.getHours()) + ':' + pad(d.getMinutes());
          return d.toDateString() === new Date().toDateString()
            ? hhmm : pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' ' + hhmm;
        }
        function size(value) {
          const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
          let n = Number(value) || 0, i = 0;
          while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
          return (i === 0 ? String(Math.round(n)) : n.toFixed(1)) + ' ' + units[i];
        }
        function label(item) {
          if (item.rx === null) return clock(item.from) + ' – ' + clock(item.to) + ' · No sample';
          return clock(item.from) + ' – ' + clock(item.to)
            + ' · Downloaded ' + size(item.tx) + ' · Uploaded ' + size(item.rx);
        }
        function select(index) {
          index = Math.max(0, Math.min(intervals.length - 1, index));
          const start = index * fraction;
          const text = label(intervals[index]);
          interval.value = index;
          interval.setAttribute('aria-valuetext', text);
          if (reading.textContent !== text) reading.textContent = text;
          selection.setAttribute('x', start * width);
          selection.setAttribute('width', Math.min(fraction, 1 - start) * width);
          selection.setAttribute('visibility', 'visible');
        }
        function selectAt(event) {
          const bounds = chart.getBoundingClientRect();
          if (bounds.width) select(Math.floor((event.clientX - bounds.left) / bounds.width / fraction));
        }
        const axis = document.querySelector('.traffic-axis span:last-child');
        const axisStart = document.querySelector('.traffic-axis span:first-child');
        if (axisStart && axis) {
          axisStart.textContent = clock({{ chart.from_ts }});
          axis.textContent = clock({{ chart.to_ts }});
        }
        chart.addEventListener('pointermove', event => { if (event.pointerType === 'mouse') selectAt(event); });
        chart.addEventListener('click', selectAt);
        interval.addEventListener('input', () => select(Number(interval.value)));
        select(intervals.length - 1);
        interval.parentElement.hidden = false;
      })();
      </script>
      {% else %}
      <p class="oc-muted" style="margin:0">no traffic recorded yet</p>
      {% endif %}
    </div>
  </section>
