{% extends "base.html" %}
{% block title %}new exit — deeps kaskad{% endblock %}
{% block body %}
<div class="crumbs"><a href="/exits">Exits</a><span>/</span><span>new</span></div>
<div class="page-head">
  <h1>New exit</h1>
  <p class="oc-muted">AmneziaWG or plain WireGuard</p>
</div>

{% if err %}<div class="oc-alert oc-alert--danger" style="margin-bottom:16px"><span class="oc-dot" style="margin-top:7px"></span><div class="oc-alert__body">{{ err }}</div></div>{% endif %}

<div class="oc-panel" style="padding:16px; max-width:780px">
  <form method="post" action="/exits">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <div class="form-grid">
      <label class="oc-field">
        <span class="oc-field__label">name</span>
        <input class="oc-input" type="text" name="name" value="{{ form.name }}"
               placeholder="de1" required maxlength="32" spellcheck="false">
      </label>
      <label class="oc-field">
        <span class="oc-field__label">mode</span>
        <span class="oc-select-wrap">
          <select class="oc-select" name="mode" id="exit-mode">
            <option value="internet" {{ 'selected' if form.mode == 'internet' }}>internet exit</option>
            <option value="routes" {{ 'selected' if form.mode == 'routes' }}>subnets only</option>
          </select>
        </span>
      </label>
      <label class="oc-field">
        <span class="oc-field__label">priority</span>
        <input class="oc-input" type="text" name="priority" value="{{ form.priority }}"
               placeholder="10" inputmode="numeric">
        <span class="oc-hint">lower is more important</span>
      </label>
      <label class="oc-field full">
        <span class="oc-field__label">comment</span>
        <input class="oc-input" type="text" name="comment" maxlength="120"
               value="{{ form.comment or '' }}" placeholder="Finland, Helsinki">
        <span class="oc-hint">shown to clients instead of the interface name</span>
      </label>
      <label class="oc-field" id="exit-routes-row">
        <span class="oc-field__label">subnets</span>
        <input class="oc-input" type="text" name="routes" id="exit-routes"
               value="{{ form.routes }}"
               placeholder="192.168.50.0/24, 10.20.0.0/24">
        <span class="oc-hint">
          filled from AllowedIPs in the provider config, or from the Address
          network when AllowedIPs is 0.0.0.0/0; edit if needed
        </span>
      </label>
      <label class="oc-field" id="exit-dns-row">
        <span class="oc-field__label">DNS from the subnet</span>
        <input class="oc-input" type="text" name="dns" value="{{ form.dns }}"
               placeholder="192.168.50.1">
        <span class="oc-hint">for clients without internet</span>
      </label>
      <label class="oc-field" id="exit-nat-row">
        <span class="oc-field__label">NAT</span>
        <span class="oc-check" style="margin-top:2px">
          <input type="checkbox" name="nat" value="on" checked>
          <span class="oc-check__box"></span>
          masquerade client addresses
        </span>
        <span class="oc-hint">
          turn off when the far side has a route back to {{ clients_net }}
        </span>
      </label>
      <label class="oc-field full">
        <span class="oc-field__label">provider config</span>
        <textarea class="oc-input oc-textarea" name="conf" required
          placeholder="[Interface]&#10;Address = ...&#10;PrivateKey = ...&#10;&#10;[Peer]&#10;PublicKey = ...&#10;Endpoint = host:port"></textarea>
        <span class="oc-hint">DNS, PostUp and IPv6 are stripped automatically; neutral parameters are added for plain WG.</span>
      </label>
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="oc-btn oc-btn--contrast">add</button>
      <a class="oc-btn oc-btn--ghost" href="/exits">cancel</a>
    </div>
  </form>
</div>

<script>
const mode = document.getElementById('exit-mode');
const routesRow = document.getElementById('exit-routes-row');
const routesInput = document.getElementById('exit-routes');
const dnsRow = document.getElementById('exit-dns-row');
const natRow = document.getElementById('exit-nat-row');
const confInput = document.querySelector('textarea[name="conf"]');
let autoRoutes = null;

function allowedNets(conf) {
  const nets = [];
  for (const line of conf.split('\n')) {
    const match = line.match(/^\s*AllowedIPs\s*=\s*(.*)$/i);
    if (!match) continue;
    for (let item of match[1].split(',')) {
      item = item.trim();
      if (!item || item.includes(':') || item.startsWith('0.0.0.0/0')) continue;
      if (!nets.includes(item)) nets.push(item);
    }
  }
  return nets;
}

// Network part of [Interface] Address, used when AllowedIPs is the default
// route: the provider still gives an address from the routed subnet.
function addressNet(conf) {
  const match = conf.match(/^\s*Address\s*=\s*([^\s,]+)/mi);
  if (!match || match[1].includes(':')) return '';
  const [ip, rawLength] = match[1].split('/');
  const parts = ip.split('.').map(Number);
  if (parts.length !== 4 || parts.some((n) => !Number.isInteger(n) || n < 0 || n > 255)) return '';
  const length = rawLength === undefined ? 32 : Number(rawLength);
  if (!Number.isInteger(length) || length < 1 || length > 32) return '';
  const value = ((parts[0] << 24) | (parts[1] << 16) | (parts[2] << 8) | parts[3]) >>> 0;
  const mask = length === 0 ? 0 : (0xFFFFFFFF << (32 - length)) >>> 0;
  const net = (value & mask) >>> 0;
  return [net >>> 24, (net >>> 16) & 255, (net >>> 8) & 255, net & 255].join('.')
    + '/' + length;
}

function syncRoutes() {
  if (!routesInput || !confInput || mode.value !== 'routes') return;
  if (routesInput.value.trim() !== '' && routesInput.value !== autoRoutes) return;
  const nets = allowedNets(confInput.value);
  const value = nets.length ? nets.join(', ') : addressNet(confInput.value);
  routesInput.value = value;
  autoRoutes = value;
}

confInput.addEventListener('input', syncRoutes);
routesInput.addEventListener('input', () => {
  if (routesInput.value !== autoRoutes) autoRoutes = null;
});

function syncMode() {
  const routes = mode.value === 'routes';
  routesRow.style.display = routes ? '' : 'none';
  dnsRow.style.display = routes ? '' : 'none';
  natRow.style.display = routes ? '' : 'none';
  if (routes) syncRoutes();
}
mode.addEventListener('change', syncMode);
syncMode();
</script>
{% endblock %}
