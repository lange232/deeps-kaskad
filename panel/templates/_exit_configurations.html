{% if clients %}
<div class="oc-panel table-scroll">
  <table class="oc-table">
    <tbody>
    {% for c in clients %}
    <tr data-href="/configs/{{ c.id }}" tabindex="0">
      <td><a class="oc-link" href="/configs/{{ c.id }}">{{ c.name }}</a></td>
      <td class="oc-mono oc-muted">{{ c.ip }}</td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<div class="oc-empty">No configurations</div>
{% endif %}
