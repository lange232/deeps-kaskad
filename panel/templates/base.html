<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}deeps kaskad{% endblock %}</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/components.css">
<style>
  html { scrollbar-gutter: stable; }
  @supports not (scrollbar-gutter: stable) {
    html { overflow-y: scroll; }
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .app {
    flex: 1 0 auto; width: 100%; box-sizing: border-box;
    display: grid; grid-template-columns: 200px minmax(0, 1fr);
    gap: 28px; max-width: 1160px; margin: 0 auto; padding: 0 16px 56px;
  }
  /* Table cells keep their width when status text changes; otherwise the
     columns jump on every auto-refresh. */
  .oc-table td { vertical-align: middle; }
  .oc-table td .oc-badge { white-space: nowrap; }
  .app--centered { grid-template-columns: minmax(0, 1fr); }
  .app--centered .main { max-width: 380px; margin: 12vh auto 0; }
  .main { min-width: 0; }
  .side { position: sticky; top: 8px; align-self: start; padding-top: 18px;
          display: flex; flex-direction: column; gap: 2px; }
  .side a {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px;
    color: var(--ui-text-muted); text-decoration: none;
    font-size: 13px; font-weight: 440; letter-spacing: -0.04px;
  }
  .side a:hover { background: var(--ui-bg-layer-1); color: var(--ui-text-base); }
  .side a.is-active { background: var(--ui-bg-layer-2); color: var(--ui-text-base); font-weight: 530; }
  .side a .oc-dot { background: currentColor; opacity: .5; }
  .side__sep { height: 1px; background: var(--ui-border-base); margin: 8px 10px; }
  .page-head { margin: 6px 0 24px; }
  .page-head h1 { margin: 0 0 4px; font-size: 20px; font-weight: 670; letter-spacing: -0.02em; }
  .page-head p { margin: 0; }
  .crumbs { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ui-text-faint); margin-bottom: 6px; }
  .crumbs a { color: var(--ui-text-muted); text-decoration: none; }
  .crumbs a:hover { color: var(--ui-text-base); }
  .stack { display: flex; flex-direction: column; gap: 24px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .actions form { display: inline; margin: 0; }
  .oc-btn { text-decoration: none; white-space: nowrap; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .full { grid-column: 1 / -1; }
  .oc-textarea { min-height: 180px; resize: vertical; font-family: var(--ui-font-mono, ui-monospace, monospace); font-size: 12px; }
  .name-cell { display: flex; align-items: center; gap: 8px; }
  .cell-sub { font-size: 11px; color: var(--ui-text-faint); }
  .kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px 20px; }
  .kv-grid .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ui-text-faint); }
  .kv-grid .v { font-size: 13px; margin-top: 3px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .stat-tile {
    display: flex; flex-direction: column; gap: 6px;
    min-height: 96px; padding: 14px 16px;
    background: var(--ui-bg-layer-1);
    border: 1px solid var(--ui-border-base);
    border-radius: var(--ui-radius-lg);
  }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ui-text-faint); }
  .stat-value { font-size: 24px; font-weight: 640; letter-spacing: -0.02em; line-height: 1.1; }
  .stat-value .of { font-size: 13px; font-weight: 440; color: var(--ui-text-faint); margin-left: 5px; letter-spacing: 0; }
  .stat-sub { font-size: 11px; line-height: 1.35; color: var(--ui-text-faint); margin-top: auto; word-break: break-word; }
  pre.conf { margin: 0; padding: 12px; overflow-x: auto; border-radius: 6px;
             background: var(--ui-bg-deep); border: 1px solid var(--ui-border-base);
             font: 12px/1.45 var(--ui-font-mono, ui-monospace, monospace); color: var(--ui-text-muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .site-footer {
    display: flex; flex-wrap: wrap; gap: 10px 24px;
    justify-content: space-between; align-items: center;
    width: 100%; max-width: 1160px; margin: 0 auto; padding: 16px 16px 24px; box-sizing: border-box;
    border-top: 1px solid var(--ui-border-base);
    font-size: 12px;
  }
  .site-footer__left, .site-footer__right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .site-footer a { color: var(--ui-text-muted); text-decoration: none; }
  .site-footer a:hover { color: var(--ui-text-base); }
  .site-footer .oc-brand { font-size: 12px; letter-spacing: .1em; }
  @media (max-width: 760px) {
    .site-footer { flex-direction: column; align-items: flex-start; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .side { position: static; flex-direction: row; overflow-x: auto; padding-top: 8px; }
    .side__sep { display: none; }
    .side a { white-space: nowrap; }
  }
</style>
</head>
<body class="oc-shell">
<header class="oc-topbar">
  <a class="oc-brand" href="/" style="text-decoration:none">
    <span class="oc-brand__dim">deeps</span><span class="oc-brand__mark">kaskad</span>
  </a>
  <span class="oc-badge oc-badge--subtle">panel</span>
  <span class="oc-topbar__spacer"></span>
  {% block topbar %}{% endblock %}
  <button class="oc-btn oc-btn--ghost-muted oc-btn--sm" id="theme-toggle" type="button">light theme</button>
  {% if not hide_nav %}
  <form method="post" action="/logout" style="margin:0">
    <button class="oc-btn oc-btn--ghost oc-btn--sm">sign out</button>
  </form>
  {% endif %}
</header>

<div class="app {{ 'app--centered' if hide_nav }}">
  {% if not hide_nav %}
  <aside class="side">
    <a href="/" class="{{ 'is-active' if nav == 'overview' }}">Overview</a>
    <a href="/exits" class="{{ 'is-active' if nav == 'exits' }}">Exits</a>
    <a href="/clients" class="{{ 'is-active' if nav == 'clients' }}">Clients</a>
    <a href="/journal" class="{{ 'is-active' if nav == 'journal' }}">Journal</a>
    <div class="side__sep"></div>
    <a href="/settings" class="{{ 'is-active' if nav == 'settings' }}">Settings</a>
  </aside>
  {% endif %}
  <main class="main">
    {% block body %}{% endblock %}
  </main>
</div>

<footer class="site-footer">
  <div class="site-footer__left">
    <span class="oc-brand"><span class="oc-brand__dim">deeps</span><span class="oc-brand__mark">kaskad</span></span>
    <span class="oc-mono oc-muted">v{{ version }}{% if commit %} · {{ commit }}{% endif %}</span>
  </div>
  <div class="site-footer__right">
    <span class="oc-muted">© 2026 deffhost inc</span>
    <a href="https://github.com/lange232/deeps-kaskad">github</a>
    <span class="oc-muted">MIT</span>
  </div>
</footer>

<script>
  const root = document.documentElement;
  try {
    const saved = localStorage.getItem('kaskad-theme');
    if (saved) root.dataset.theme = saved;
  } catch (e) {}
  const themeBtn = document.getElementById('theme-toggle');
  const syncTheme = () => {
    themeBtn.textContent = root.dataset.theme === 'light' ? 'dark theme' : 'light theme';
  };
  themeBtn.addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('kaskad-theme', root.dataset.theme); } catch (e) {}
    syncTheme();
  });
  syncTheme();
</script>
</body>
</html>
