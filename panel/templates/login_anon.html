<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #0d0d0e; color: #e9e7e4;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card { width: 100%; max-width: 340px; }
  h1 { margin: 0 0 20px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  label { display: block; margin-top: 14px; font-size: 12px; color: #9b9790; }
  input {
    width: 100%; margin-top: 5px; padding: 9px 10px;
    border: 1px solid #2b2b2e; border-radius: 6px;
    background: #161617; color: inherit; font: inherit;
  }
  input:focus-visible { outline: 2px solid #6b6b74; outline-offset: 1px; }
  button {
    width: 100%; margin-top: 20px; padding: 10px;
    border: 0; border-radius: 6px; background: #e9e7e4; color: #121213;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #fff; }
  .error {
    margin-bottom: 14px; padding: 9px 11px; border-radius: 6px;
    background: #2a1516; border: 1px solid #5c2528; color: #f3b9b6;
    font-size: 13px;
  }
</style>
</head>
<body>
<main class="card">
  <h1>Sign in</h1>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label for="email">email</label>
    <input id="email" type="text" name="email" value="{{ email }}" autofocus
           autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="password">password</label>
    <input id="password" type="password" name="password"
           autocomplete="current-password" required>
    <button type="submit">sign in</button>
  </form>
</main>
</body>
</html>
