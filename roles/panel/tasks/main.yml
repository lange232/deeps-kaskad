---
- name: Product version
  ansible.builtin.set_fact:
    kaskad_version: "{{ lookup('file', kaskad_repo_dir ~ '/VERSION') | trim }}"
    kaskad_commit: >-
      {{ (lookup('pipe', 'git -C ' ~ kaskad_repo_dir ~ ' rev-parse --short=8 HEAD 2>/dev/null || true') | trim)
         ~ ('' if (lookup('pipe', 'git -C ' ~ kaskad_repo_dir ~ ' status --porcelain --untracked-files=no 2>/dev/null || true') | trim) == ''
            else '-dirty') }}

- name: Panel packages
  ansible.builtin.apt:
    state: present
    name:
      - python3-venv
      - python3-pip
      - qrencode
      - openssl
      - conntrack
      - curl

- name: Fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
    state: present

- name: Fail2ban filter for the panel
  ansible.builtin.template:
    src: fail2ban-panel-filter.conf.j2
    dest: /etc/fail2ban/filter.d/kaskad-panel.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Fail2ban jails
  ansible.builtin.template:
    src: fail2ban-kaskad.local.j2
    dest: /etc/fail2ban/jail.d/kaskad.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Fail2ban service
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/kaskad, mode: "0755" }
    # The code is unpacked here; on a fresh host it does not exist yet.
    - { path: /opt/kaskad/app, mode: "0755" }
    - { path: /etc/kaskad, mode: "0700" }
    - { path: /etc/kaskad/tls, mode: "0700" }
    - { path: /var/lib/kaskad, mode: "0700" }
    - { path: "{{ kaskad_backup_dir }}", mode: "0700" }

- name: awg-quick drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/awg-quick@.service.d
    state: directory
    mode: "0755"

- name: Restart exit interfaces on failure
  ansible.builtin.template:
    src: awg-quick-dropin.conf.j2
    dest: /etc/systemd/system/awg-quick@.service.d/kaskad.conf
    owner: root
    group: root
    mode: "0644"

- name: Remove the old upstream drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/awg-quick@awg1.service.d/kaskad.conf
    state: absent
  notify: Restart panel

# One archive instead of a file-by-file copy: over a slow link the recursive
# copy spent a round trip per file and could hang for minutes, while a single
# small transfer takes seconds. The archive excludes bytecode so a stale
# __pycache__ never lands on the host.
- name: Panel source archive
  ansible.builtin.command:
    cmd: >-
      tar -czf /tmp/kaskad-panel.tgz --exclude=__pycache__
      -C {{ kaskad_repo_dir }}/panel .
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

- name: Copy the panel archive
  ansible.builtin.copy:
    src: /tmp/kaskad-panel.tgz
    dest: /tmp/kaskad-panel.tgz
    mode: "0600"
  register: kaskad_panel_archive

- name: Unpack the panel code
  ansible.builtin.unarchive:
    src: /tmp/kaskad-panel.tgz
    dest: /opt/kaskad/app
    remote_src: true
    extra_opts:
      - --overwrite
      - --no-same-owner
  when: kaskad_panel_archive.changed
  changed_when: kaskad_panel_archive.changed
  notify:
    - Restart panel
    - Restart failover

- name: Panel archive on the host
  ansible.builtin.file:
    path: /tmp/kaskad-panel.tgz
    state: absent

# Dependencies are installed only when requirements.txt changed: the pip run
# talks to PyPI, and on a slow or lossy link it is what made a code deploy
# hang for minutes. The tag lets a code-only deploy skip the step entirely.
- name: Requirements file on the host
  tags: [deps]
  ansible.builtin.stat:
    path: /opt/kaskad/app/requirements.txt
    checksum_algorithm: sha256
  register: kaskad_panel_requirements

- name: Installed requirements marker
  tags: [deps]
  ansible.builtin.stat:
    path: /opt/kaskad/venv/.requirements.sha256
  register: kaskad_panel_requirements_marker

- name: Installed requirements checksum
  tags: [deps]
  ansible.builtin.slurp:
    src: /opt/kaskad/venv/.requirements.sha256
  register: kaskad_panel_requirements_installed
  when: kaskad_panel_requirements_marker.stat.exists
  failed_when: false

- name: Virtual environment
  tags: [deps]
  ansible.builtin.pip:
    requirements: /opt/kaskad/app/requirements.txt
    virtualenv: /opt/kaskad/venv
    virtualenv_command: python3 -m venv
  notify: Restart panel
  when: >-
    not kaskad_panel_requirements_marker.stat.exists
    or (kaskad_panel_requirements_installed.content | default('') | b64decode | trim)
       != kaskad_panel_requirements.stat.checksum

- name: Remember installed requirements
  tags: [deps]
  ansible.builtin.copy:
    content: "{{ kaskad_panel_requirements.stat.checksum }}\n"
    dest: /opt/kaskad/venv/.requirements.sha256
    owner: root
    group: root
    mode: "0644"
  when: >-
    not kaskad_panel_requirements_marker.stat.exists
    or (kaskad_panel_requirements_installed.content | default('') | b64decode | trim)
       != kaskad_panel_requirements.stat.checksum

- name: Public TLS certificate
  ansible.builtin.include_tasks: tls.yml
  when: kaskad_tls_mode == 'letsencrypt'

- name: Current certificate SAN
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -in /etc/kaskad/tls/panel.crt -noout -ext subjectAltName 2>/dev/null \
      | tail -n +2 | tr ',' '\n' | sed 's/.*://' | tr -d ' ' | grep -v '^$' | sort | tr '\n' ' '
  args:
    executable: /bin/bash
  register: kaskad_tls_san
  changed_when: false
  failed_when: false

- name: Certificate
  ansible.builtin.shell: |
    set -euo pipefail
    openssl req -x509 -newkey rsa:2048 -sha256 -days 825 -nodes \
      -keyout /etc/kaskad/tls/panel.key \
      -out /etc/kaskad/tls/panel.crt \
      -subj "/CN=kaskad" \
      -addext "subjectAltName={{ kaskad_panel_san }}"
    chmod 0600 /etc/kaskad/tls/panel.key
    chmod 0644 /etc/kaskad/tls/panel.crt
  args:
    executable: /bin/bash
  when: >-
    kaskad_tls_mode == 'selfsigned'
    and (kaskad_panel_tls_regen == 'always'
         or kaskad_tls_san.rc != 0
         or (kaskad_tls_san.stdout | trim) != (kaskad_panel_san_list | trim))
  notify: Restart panel

- name: Password and session secret
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import base64, hashlib, os, secrets
    pw = secrets.token_urlsafe(18)
    salt = os.urandom(16)
    digest = hashlib.pbkdf2_hmac("sha256", pw.encode(), salt, 310000)
    b64 = lambda b: base64.b64encode(b).decode()
    with open("/etc/kaskad/panel.env", "w") as fh:
        fh.write("KASKAD_ADMIN_PASSWORD_HASH=pbkdf2$310000$%s$%s\n" % (b64(salt), b64(digest)))
        fh.write("KASKAD_SESSION_SECRET=%s\n" % base64.urlsafe_b64encode(os.urandom(32)).decode())
    os.chmod("/etc/kaskad/panel.env", 0o600)
    print(pw)
    PY
  args:
    executable: /bin/bash
    creates: /etc/kaskad/panel.env
  register: kaskad_panel_password
  no_log: true

- name: Panel password (shown once)
  ansible.builtin.debug:
    msg: "panel password: {{ kaskad_panel_password.stdout | trim }}"
  when:
    - not ansible_check_mode
    - kaskad_panel_password is changed

- name: Panel config
  ansible.builtin.template:
    src: panel.json.j2
    dest: /etc/kaskad/panel.json
    owner: root
    group: root
    mode: "0600"
  notify: Restart panel

- name: Seed file present?
  ansible.builtin.stat:
    path: "{{ kaskad_repo_dir }}/state/seed.json"
  delegate_to: localhost
  # A local lookup must not ask for root: sudo is not always available here.
  become: false
  run_once: true
  register: kaskad_seed_stat

- name: Seed file
  ansible.builtin.copy:
    src: "{{ kaskad_repo_dir }}/state/seed.json"
    dest: /etc/kaskad/seed.json
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: kaskad_seed_stat.stat.exists

- name: Import clients
  ansible.builtin.command:
    cmd: /opt/kaskad/venv/bin/python /opt/kaskad/app/app.py seed /etc/kaskad/seed.json
    chdir: /opt/kaskad/app
  environment:
    KASKAD_CONFIG: /etc/kaskad/panel.json
    KASKAD_DB: /var/lib/kaskad/panel.db
  register: kaskad_seed_run
  changed_when: "'imported 0 clients, 0 exits' not in kaskad_seed_run.stdout"
  when:
    - not ansible_check_mode
    - kaskad_seed_stat.stat.exists

- name: /run/kaskad at boot
  ansible.builtin.template:
    src: kaskad-tmpfiles.conf.j2
    dest: /etc/tmpfiles.d/kaskad.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart panel
    - Restart failover

- name: Create /run/kaskad now
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/kaskad.conf
  changed_when: false

- name: Panel unit
  ansible.builtin.template:
    src: kaskad-panel.service.j2
    dest: /etc/systemd/system/kaskad-panel.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart panel

- name: Failover unit
  ansible.builtin.template:
    src: kaskad-failover.service.j2
    dest: /etc/systemd/system/kaskad-failover.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart failover

- name: Failover started
  ansible.builtin.systemd:
    name: kaskad-failover
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Traffic sampler unit
  ansible.builtin.template:
    src: kaskad-traffic.service.j2
    dest: /etc/systemd/system/kaskad-traffic.service
    owner: root
    group: root
    mode: "0644"

- name: Traffic sampler timer
  ansible.builtin.template:
    src: kaskad-traffic.timer.j2
    dest: /etc/systemd/system/kaskad-traffic.timer
    owner: root
    group: root
    mode: "0644"

- name: Traffic sampler timer enabled
  ansible.builtin.systemd:
    name: kaskad-traffic.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: awg0 enabled
  ansible.builtin.systemd:
    name: awg-quick@awg0
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: Panel started
  ansible.builtin.systemd:
    name: kaskad-panel
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Apply pending restarts before the first backup
  # Handlers run at the end of the play by default, which would make the first
  # archive contain the database and code of the previous release.
  ansible.builtin.meta: flush_handlers

- name: Backup script
  ansible.builtin.template:
    src: kaskad-backup.sh.j2
    dest: /usr/local/sbin/kaskad-backup
    owner: root
    group: root
    mode: "0750"

- name: Backup service
  ansible.builtin.template:
    src: kaskad-backup.service.j2
    dest: /etc/systemd/system/kaskad-backup.service
    owner: root
    group: root
    mode: "0644"

- name: Backup timer
  ansible.builtin.template:
    src: kaskad-backup.timer.j2
    dest: /etc/systemd/system/kaskad-backup.timer
    owner: root
    group: root
    mode: "0644"

- name: Backup timer enabled
  ansible.builtin.systemd:
    name: kaskad-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Backup directory exists?
  ansible.builtin.stat:
    path: "{{ kaskad_backup_dir }}"
  register: kaskad_backup_dir_stat

- name: Existing backups
  ansible.builtin.find:
    paths: "{{ kaskad_backup_dir }}"
    patterns: "kaskad-*.tar.gz"
    file_type: file
  register: kaskad_backup_files
  when: kaskad_backup_dir_stat.stat.exists

- name: First backup
  ansible.builtin.command: /usr/local/sbin/kaskad-backup
  changed_when: true
  when:
    - not ansible_check_mode
    - kaskad_backup_dir_stat.stat.exists
    - (kaskad_backup_files.matched | default(0)) == 0

# The Android client is not part of this deploy. It is a release artifact of
# the client repository, placed on the host as /var/lib/kaskad/app.apk outside
# Ansible: the panel reads its version and digest from that file on request.
# Keeping a copy in the server repo once replaced a newer client on a stand,
# so the deploy deliberately does not know about the file at all.
