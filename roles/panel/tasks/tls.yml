---
# Public TLS certificate through Let's Encrypt.
#
# HTTP-01 validation needs a DNS A record pointing at this host and port 80
# reachable from the internet for a few seconds. The panel keeps listening on
# its own port the whole time, so issuance does not interrupt it.

- name: Let's Encrypt settings
  ansible.builtin.assert:
    that:
      - kaskad_le_domain | length > 0
      - kaskad_le_email | length > 0
    fail_msg: >-
      set kaskad_le_domain and kaskad_le_email when
      kaskad_tls_mode=letsencrypt
    quiet: true

- name: Certbot
  ansible.builtin.apt:
    lock_timeout: 300
    name: certbot
    state: present
  when: not ansible_check_mode

- name: Resolve the ACME domain
  ansible.builtin.command: getent ahostsv4 {{ kaskad_le_domain }}
  register: kaskad_le_domain_lookup
  changed_when: false
  failed_when: false
  check_mode: false

- name: Resolve this host
  ansible.builtin.command: getent ahostsv4 {{ ansible_host }}
  register: kaskad_le_host_lookup
  changed_when: false
  failed_when: false
  check_mode: false

- name: DNS points at this host
  ansible.builtin.assert:
    that:
      - kaskad_le_domain_lookup.rc == 0
      - kaskad_le_host_lookup.rc == 0
      - (kaskad_le_domain_lookup.stdout_lines[0] | split())[0]
        == (kaskad_le_host_lookup.stdout_lines[0] | split())[0]
    fail_msg: >-
      {{ kaskad_le_domain }} and {{ ansible_host }} must resolve to the same
      address; Let's Encrypt would fail the HTTP-01 challenge
    quiet: true

- name: Port 80 is free on the host
  ansible.builtin.command: ss -ltnH "sport = :80"
  register: kaskad_le_port80
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check port 80
  ansible.builtin.assert:
    that:
      - kaskad_le_port80.stdout | trim == ""
    fail_msg: >-
      something already listens on port 80: {{ kaskad_le_port80.stdout | trim }};
      certbot standalone needs it for the HTTP-01 challenge
    quiet: true

- name: Existing certificate
  ansible.builtin.command:
    argv: [certbot, certificates, --cert-name, "{{ kaskad_le_domain }}"]
  register: kaskad_le_existing
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode

# Renewal is certbot.timer's job; a deploy must not call the ACME server every
# time. Issue only when there is no certificate, it is close to expiry, or a
# staging certificate has to be replaced by a real one.
- name: Certificate needs issuance
  ansible.builtin.set_fact:
    kaskad_le_days_left: >-
      {{ (kaskad_le_existing.stdout | default('')
          | regex_findall('VALID: (\\d+) day') | first | default('0')) | int }}
    kaskad_le_issue_needed: >-
      {{ (kaskad_le_existing.rc | default(1)) != 0
         or (kaskad_le_existing.stdout | default('')
             | regex_findall('VALID: (\\d+) day') | first | default('0') | int) < 30
         or (not (kaskad_le_staging | bool)
             and 'TEST_CERT' in (kaskad_le_existing.stdout | default(''))) }}
  when: not ansible_check_mode

# certbot keeps a staging certificate until it is close to expiry, so
# --keep-until-expiring would never replace it with a real one. A test
# certificate is deleted explicitly before the real run.
- name: Drop a staging certificate before issuing the real one
  ansible.builtin.command:
    argv: [certbot, delete, --cert-name, "{{ kaskad_le_domain }}", --non-interactive]
  when:
    - not ansible_check_mode
    - not (kaskad_le_staging | bool)
    - "'TEST_CERT' in (kaskad_le_existing.stdout | default(''))"

- name: Obtain the certificate
  ansible.builtin.command:
    argv: >-
      {{ ['certbot', 'certonly', '--standalone', '--non-interactive',
          '--agree-tos', '--keep-until-expiring',
          '-d', kaskad_le_domain, '--email', kaskad_le_email]
         + (['--staging'] if kaskad_le_staging | bool else []) }}
  register: kaskad_le_issue
  changed_when: "'Certificate not yet due for renewal' not in kaskad_le_issue.stdout"
  when:
    - not ansible_check_mode
    - kaskad_le_issue_needed | bool

- name: Renewal hook directory
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Restart the panel after a renewal
  ansible.builtin.template:
    src: certbot-deploy-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/kaskad-panel.sh
    owner: root
    group: root
    mode: "0755"
