---
- name: Restart panel
  ansible.builtin.systemd:
    name: kaskad-panel
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart failover
  ansible.builtin.systemd:
    name: kaskad-failover
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
