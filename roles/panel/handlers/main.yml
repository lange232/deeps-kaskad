---
# Tagged always so a notified restart still runs under --tags code: the fast
# path must restart the panel after new code lands.
- name: Restart panel
  ansible.builtin.systemd:
    name: kaskad-panel
    state: restarted
    daemon_reload: true
  tags: [always]
  when: not ansible_check_mode

- name: Restart failover
  ansible.builtin.systemd:
    name: kaskad-failover
    state: restarted
    daemon_reload: true
  tags: [always]
  when: not ansible_check_mode

- name: Restart SOCKS proxy
  ansible.builtin.systemd:
    name: kaskad-socks
    state: restarted
    daemon_reload: true
  tags: [always]
  when: not ansible_check_mode

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
