[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
forks = 4
retry_files_enabled = False
deprecation_warnings = False

[ssh_connection]
pipelining = True
# Keepalive turns a silently dead channel into a failed task in about a
# minute instead of a run that hangs for tens of minutes (seen on libra).
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=10
