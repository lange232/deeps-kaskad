[defaults]
inventory = inventory.yml
roles_path = roles
# Accept a host key on first contact and remember it: a later change is then a
# real warning instead of a silent MITM. A rebuilt host needs its old key
# removed from known_hosts.
host_key_checking = True
interpreter_python = auto_silent
forks = 4
retry_files_enabled = False
deprecation_warnings = False

[ssh_connection]
pipelining = True
# One multiplexed connection for the whole run: a fresh SSH handshake to a
# slow stand costs seconds, and ~95 tasks would pay it every time. The master
# lives 5 minutes so back-to-back runs reuse it. Keepalive is patient enough
# to ride out a short stall on the link instead of failing the task (libra).
# GSSAPI is off: it adds a round trip before publickey on every connection.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=20 -o GSSAPIAuthentication=no
